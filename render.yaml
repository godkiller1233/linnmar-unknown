services:
  - type: web
    name: linnmar-unknown
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.17.0
      - key: ADMIN_USERNAME
        value: unknown
      - key: ADMIN_TAG
        value: official
      - key: TERMS_VERSION
        value: 1.0
      - key: MAX_FILE_MB
        value: 50
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: linnmar-unknown-db
          property: connectionString
      - key: DISCORD_BRIDGE_ENABLED
        value: "false"
      - key: DISCORD_BRIDGE_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: linnmar-files

databases:
  - name: linnmar-unknown-db
    plan: free
    databaseName: linnmar
    user: linnmar
